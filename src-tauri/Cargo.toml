[package]
name = "daad"
version = "0.5.0-3"
description = "Daad Softphone Desktop"

authors = ["Daad Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "daad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.29"
tokio-rustls = "0.26"
futures-util = "0.3"
rustls-pki-types = "1"
webpki-roots = "1.0"
rustls-pemfile = "2"
md-5 = "0.10"
hex = "0.4"
keyring = "3"
rtp = "0.17"
webrtc-srtp = "0.17"
cpal = "0.17"
rand = "0.8"
base64 = "0.22"
thiserror = "1"
ezk-g711 = "0.2.0"
audiopus = "0.2"
bytes = "1"
webrtc-util = "0.17"

[profile.dev]
opt-level = 0
debug = 0
codegen-units = 256
incremental = true

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
panic = "abort"
strip = true
