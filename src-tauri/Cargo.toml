[package]
name = "daad"
version = "0.7.0"
description = "Daad Softphone Desktop"
license = "GPL-3.0-or-later"

authors = ["Daad Team"]
edition = "2021"
rust-version = "1.77.2"

[workspace]
members = ["plugins/phone-platform"]

[lib]
name = "daad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1"
pkg-config = "0.3"
serde_json = "1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-process = "2"
tokio = { version = "1.38", features = ["sync"] }
keyring = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-phone-platform = { path = "plugins/phone-platform" }
jni = "0.21"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
rustls-native-certs = "0.8"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[profile.dev]
opt-level = 0
debug = 0
codegen-units = 256
incremental = true

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
panic = "abort"
strip = true
