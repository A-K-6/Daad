[package]
name = "daad"
version = "0.1.2"
description = "Daad Softphone Desktop"
authors = ["Daad Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "daad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = "0.29"
tokio-rustls = "0.26"
futures-util = "0.3"
rustls-pki-types = "1"
webpki-roots = "1.0"
