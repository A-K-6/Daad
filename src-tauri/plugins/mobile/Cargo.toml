[package]
name = "tauri-plugin-mobile"
version = "0.1.0"
authors = [ "Daad Team" ]
description = "Daad mobile microphone permission and browser integration"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-mobile"

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
