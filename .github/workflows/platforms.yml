name: Platform builds

on:
  pull_request:
  push:
    branches: ['codex/platforms']
  workflow_dispatch:
    inputs:
      android_release:
        description: Build Android APKs with the configured release key
        type: boolean
        default: false
  workflow_call:
    inputs:
      android_release:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            msvc: amd64
          - runner: windows-2022
            target: aarch64-pc-windows-msvc
            bundles: nsis
            msvc: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}
      - name: Configure Visual Studio developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -SkipAutomaticLocation -Arch ${{ matrix.msvc }} -HostArch amd64
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VSINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion', 'VSCMD_ARG_TGT_ARCH', 'VSCMD_VER')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
      - uses: microsoft/setup-msbuild@v3
        if: runner.os == 'Windows'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libdbus-1-dev
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - uses: actions/cache@v6
        with:
          path: src-tauri/target/native
          key: native-${{ matrix.target }}-${{ hashFiles('scripts/build-native.ts', 'scripts/native-targets.ts', 'scripts/patches/*.patch') }}
      - run: bun install --frozen-lockfile
      - run: bun run native:prepare ${{ matrix.target }}
      - name: Rust tests on native runner
        if: matrix.msvc != 'arm64'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build installer
        run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            tauri: aarch64
          - target: armv7-linux-androideabi
            tauri: armv7
          - target: x86_64-linux-android
            tauri: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install native tools
        run: |
          sudo apt-get update && sudo apt-get install -y pkg-config
          sdkmanager=$(find "${ANDROID_HOME:?}/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)
          test -n "$sdkmanager"
          echo "$(dirname "$sdkmanager")" >> "$GITHUB_PATH"
          "$sdkmanager" 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: src-tauri/target/native
          key: native-${{ matrix.target }}-${{ hashFiles('scripts/build-native.ts', 'scripts/native-targets.ts', 'scripts/patches/*.patch') }}
      - run: bun install --frozen-lockfile
      - run: bun run native:prepare ${{ matrix.target }}
      - run: bun run tauri android init --ci
      - name: Build development APK
        if: ${{ !inputs.android_release }}
        run: bun run tauri android build --debug --apk --target ${{ matrix.tauri }}
      - name: Configure release signing
        if: inputs.android_release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bun scripts/configure-android-signing.ts
      - name: Build signed release APK
        if: inputs.android_release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bun run tauri android build --apk --target ${{ matrix.tauri }}
      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ inputs.android_release && 'release' || 'development' }}-${{ matrix.target }}
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - run: brew install pkg-config cocoapods xcodegen
      - uses: actions/cache@v6
        with:
          path: src-tauri/target/native
          key: native-aarch64-apple-ios-sim-${{ hashFiles('scripts/build-native.ts', 'scripts/native-targets.ts', 'scripts/patches/*.patch') }}
      - run: bun install --frozen-lockfile
      - run: bun run native:prepare aarch64-apple-ios-sim
      - run: bun run tauri ios init --ci --skip-targets-install
      - run: bun run tauri ios build --debug --target aarch64-sim --no-sign --ci
      - name: Archive simulator app
        run: |
          app=$(find src-tauri/gen/apple/build -type d -name Daad.app -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" Daad-iOS-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: Daad-iOS-simulator.zip
          if-no-files-found: error
