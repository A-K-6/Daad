name: Platform builds

on:
  pull_request:
  push:
    branches: ['codex/platforms']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            bundles: dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            msvc: amd64
          - runner: windows-2022
            target: aarch64-pc-windows-msvc
            bundles: nsis
            msvc: amd64_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc }}
      - uses: microsoft/setup-msbuild@v2
        if: runner.os == 'Windows'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libdbus-1-dev
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: brew install pkg-config
      - uses: actions/cache@v6
        with:
          path: src-tauri/target/native
          key: native-${{ matrix.target }}-${{ hashFiles('scripts/build-native.ts', 'scripts/native-targets.ts') }}
      - run: bun install --frozen-lockfile
      - run: bun run native:prepare ${{ matrix.target }}
      - name: Rust tests on native runner
        if: matrix.msvc != 'amd64_arm64'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build installer
        run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            tauri: aarch64
          - target: armv7-linux-androideabi
            tauri: armv7
          - target: x86_64-linux-android
            tauri: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install native tools
        run: |
          sudo apt-get update && sudo apt-get install -y pkg-config
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: src-tauri/target/native
          key: native-${{ matrix.target }}-${{ hashFiles('scripts/build-native.ts', 'scripts/native-targets.ts') }}
      - run: bun install --frozen-lockfile
      - run: bun run native:prepare ${{ matrix.target }}
      - run: bun run tauri android init --ci
      - name: Build development APK
        run: bun run tauri android build --debug --apk --target ${{ matrix.tauri }}
      - uses: actions/upload-artifact@v7
        with:
          name: android-development-${{ matrix.target }}
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - run: brew install pkg-config cocoapods xcodegen
      - uses: actions/cache@v6
        with:
          path: src-tauri/target/native
          key: native-aarch64-apple-ios-sim-${{ hashFiles('scripts/build-native.ts', 'scripts/native-targets.ts') }}
      - run: bun install --frozen-lockfile
      - run: bun run native:prepare aarch64-apple-ios-sim
      - run: bun run tauri ios init --ci --skip-targets-install
      - run: bun run tauri ios build --debug --target aarch64-sim --no-sign --ci
      - name: Archive simulator app
        run: |
          app=$(find src-tauri/gen/apple/build -type d -name Daad.app -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" Daad-iOS-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: Daad-iOS-simulator.zip
          if-no-files-found: error
