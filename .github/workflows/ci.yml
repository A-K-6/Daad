name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Check & Tests (Parallel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js (Latest)
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck TypeScript
        run: bun run typecheck

      - name: Lint Repo Hygiene (aliases, fixture secrets, captures)
        run: bun run lint

      - name: Build Frontend
        run: bun run build

      - name: Run Automated Test Suite
        run: bun run test

  backend:
    name: Rust Backend Check (Parallel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install native build tools
        run: brew install openssl@3 pkg-config

      - name: Build pinned PJSIP with TLS and SRTP
        run: bun run native:prepare

      - name: Cargo Check Backend
        working-directory: ./src-tauri
        run: cargo check

      - name: Cargo Test Native Adapter
        working-directory: ./src-tauri
        run: cargo test
