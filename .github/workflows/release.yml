name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platforms:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/platforms.yml

  publish:
    needs: platforms
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install pkg-config
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run lint && bun run test
      - run: bun run native:prepare aarch64-apple-darwin
      - run: python3 scripts/package-source.py
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Create source-complete desktop prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p publish-assets
          find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} publish-assets/ \;
          cp src-tauri/target/release-sources/*.tar.gz publish-assets/
          (cd publish-assets && shasum -a 256 * > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" publish-assets/* --draft --prerelease --title "Daad $RELEASE_TAG — native alpha" --notes-file docs/RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
