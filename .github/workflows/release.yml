name: Cross-platform release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      android_only:
        description: Validate Android without rebuilding desktop packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run release:check && bun run typecheck && bun run lint && bun run test && bun run build

  desktop:
    if: ${{ !inputs.android_only }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            bundles: dmg
          - os: ubuntu-22.04
            platform: linux-x64
            bundles: deb,appimage
          - os: windows-2022
            platform: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - if: runner.os == 'macOS'
        run: brew install openssl@3 pkg-config
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev libdbus-1-dev patchelf pkg-config
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v6
        id: native
        with:
          path: src-tauri/target/native
          key: pjsip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-native.ts', 'scripts/build-windows.ps1') }}
      - if: steps.native.outputs.cache-hit != 'true'
        run: bun run native:prepare
      - if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: src-tauri/target/native
          key: ${{ steps.native.outputs.cache-primary-key }}
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - if: runner.os == 'Linux'
        run: bun run test:native
      - run: bun run tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: daad-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe

  android:
    needs: frontend
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - name: Select NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v6
        id: native
        with:
          path: src-tauri/target/native/android-arm64
          key: pjsip-android-arm64-ndk28.2-${{ hashFiles('scripts/build-native.ts') }}
      - if: steps.native.outputs.cache-hit != 'true'
        run: bun run native:prepare --target aarch64-linux-android
      - if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: src-tauri/target/native/android-arm64
          key: ${{ steps.native.outputs.cache-primary-key }}
      - run: bun run android:prepare
      - name: Load release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'daad-release.jks'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'DAAD_ANDROID_KEYSTORE={path}\n')
          PY
      - name: Require signing for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        run: test -n "$DAAD_ANDROID_KEYSTORE" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_PASSWORD"
      - run: bun run tauri android build --apk --aab --target aarch64 --ci
      - name: Verify signed release APK
        if: env.DAAD_ANDROID_KEYSTORE != ''
        run: find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose '{}' \;
      - uses: actions/upload-artifact@v7
        with:
          name: daad-android-arm64
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/daad-release.jks"

  source:
    if: ${{ !inputs.android_only }}
    needs: frontend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install openssl@3 pkg-config
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@v6
        id: native
        with:
          path: src-tauri/target/native
          key: pjsip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-native.ts', 'scripts/build-windows.ps1') }}
      - if: steps.native.outputs.cache-hit != 'true'
        run: bun run native:prepare
      - if: steps.native.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: src-tauri/target/native
          key: ${{ steps.native.outputs.cache-primary-key }}
      - run: python3 scripts/package-source.py
      - uses: actions/upload-artifact@v7
        with:
          name: daad-source
          if-no-files-found: error
          path: src-tauri/target/release-sources/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, desktop, android, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Stage assets and checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          out = Path('release-assets')
          out.mkdir()
          for path in Path('artifacts').rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.dmg', '.deb', '.appimage', '.exe', '.apk', '.aab', '.gz'}:
                  name = f'Daad_{version}_android_arm64{path.suffix}' if path.suffix.lower() in {'.apk', '.aab'} else path.name
                  if (out / name).exists():
                      raise RuntimeError(f'Duplicate release asset: {name}')
                  shutil.copy2(path, out / name)
          files = sorted(out.iterdir())
          required = {'.dmg', '.deb', '.appimage', '.exe', '.apk', '.aab', '.gz'}
          if required - {p.suffix.lower() for p in files}:
              raise RuntimeError('A required platform asset is missing')
          (out / 'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - name: Publish complete validation release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 - <<'PY'
          import json
          if not json.load(open('release-state.json'))['isDraft']:
              raise RuntimeError('This release is already published; preserving its assets')
          PY
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "Daad $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" --draft --prerelease --title "Daad $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md release-assets/*
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
