name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  NODE_OPTIONS: '--no-deprecation'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rustflags: '-C codegen-units=16 -C split-debuginfo=unpacked'
          - platform: 'ubuntu-22.04'
            args: ''
            rustflags: '-C link-arg=-fuse-ld=mold -C codegen-units=16'
          - platform: 'windows-latest'
            args: ''
            rustflags: '-C codegen-units=16'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable Windows Defender (Accelerate Windows builds)
        if: matrix.platform == 'windows-latest'
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
        shell: powershell

      - name: Setup Node.js (Latest)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install Linux system dependencies & Mold Linker
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev mold clang

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Daad Softphone ${{ github.ref_name }}'
          releaseBody: |
            ### Daad Softphone Native MVP Alpha ${{ github.ref_name }}

            Native Rust SIP/TLS + SDES-SRTP MVP (PCMU/PCMA, RFC 4733, numeric extensions).
            Desktop test build — live Asterisk proof pending. Configure host/port/CA in Provisioning, never hardcodes IPs.

            #### Downloads:
            - **macOS (Apple Silicon):** `Daad_${{ github.ref_name }}_aarch64.dmg`
            - **Windows (x64):** `Daad_${{ github.ref_name }}_x64-setup.exe` / `.msi`
            - **Linux (x64):** `Daad_${{ github.ref_name }}_amd64.AppImage` / `.deb`
            
            > **macOS Note:** For unsigned open-source binaries, run `xattr -cr /Applications/Daad.app` in Terminal or click *Open Anyway* in System Settings > Privacy & Security.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing release draft for tag ${{ github.ref_name }}..."
          gh release edit "${{ github.ref_name }}" --draft=false
