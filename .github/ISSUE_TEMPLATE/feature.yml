name: Feature request
description: Propose a small improvement to the native softphone.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the calling workflow and who needs it.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Smallest useful change
      description: Keep the one-account, one-call scope in mind. Include alternatives if useful.
    validations:
      required: true
