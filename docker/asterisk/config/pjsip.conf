; ── JBM contract: transports ──────────────────────────────────────
; TLS 5061 (primary, WSS-capable clients bridge via Rust sip_bridge),
; TCP 5060 + UDP 5060 for fallback. Symmetric RTP + contact rewrite on
; every endpoint template so NAT/VPN/sleep-recovery re-INVITEs work.

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /etc/asterisk/keys/asterisk.crt
priv_key_file = /etc/asterisk/keys/asterisk.key
ca_list_file = /etc/asterisk/keys/ca.crt
method = tlsv1_2
verify_client = no
verify_server = no
; NOTE: server cert verification happens client-side (Daad must
; fail-closed on untrusted cert unless user explicitly allows insecure).

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; ── Shared endpoint template: the actual contract ─────────────────────
[daad-endpoint](!)
type = endpoint
transport = transport-tls
context = daad-extensions
disallow = all
allow = ulaw,alaw
; SDES-SRTP mandatory — never offer/accept plain RTP on TLS endpoints.
media_encryption = sdes
; RFC 4733 DTMF (out-of-band telephone-event, never in-band audio).
dtmf_mode = rfc4733
; Symmetric RTP + NAT traversal: learn remote addr, rewrite contact.
rtp_symmetric = yes
rewrite_contact = yes
force_rport = yes
direct_media = no
; Single-contact binding: duplicate REGISTER replaces, never accumulates.
; (Enforced per-AOR below with max_contacts=1 + remove_existing=yes.)
tone_zone = us
language = en
; Registration expiry window; client refreshes must not create dupes.
; (aors below: maximum_expiration=3600, minimum_expiration=60,
;  default_expiration=600.)

[daad-auth](!)
type = auth
auth_type = userpass
; password is injected via envsubst at container start from
; ${DAAD_TEST_PASSWORD_<EXT>} — NEVER committed. See README.

[daad-aor](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30
maximum_expiration = 3600
minimum_expiration = 60
default_expiration = 600

; ── Interop endpoint template: PCMU/PCMA preferred, Opus trailing ────
; Same closed-profile guarantees as daad-endpoint (mandatory SDES-SRTP,
; symmetric RTP, no video) — only the codec allow-list differs, and only
; for the interop extension pair below. JBM extensions (1001/1002) never
; use this template: their offers stay exactly [PCMU, PCMA].
[daad-endpoint-opus](!)
type = endpoint
transport = transport-tls
context = daad-extensions
disallow = all
allow = ulaw,alaw,opus
media_encryption = sdes
dtmf_mode = rfc4733
rtp_symmetric = yes
rewrite_contact = yes
force_rport = yes
direct_media = no
tone_zone = us
language = en

; ── Test extensions (device-scoped creds only, numeric dial only) ─────
; 1001 / 1002 are the two-client soak pair. Passwords come from env.

[1001](daad-endpoint)
aors = 1001
auth = 1001

[1001](daad-auth)
username = 1001
password = ${DAAD_TEST_PASSWORD_1001}

[1001](daad-aor)

[1002](daad-endpoint)
aors = 1002
auth = 1002

[1002](daad-auth)
username = 1002
password = ${DAAD_TEST_PASSWORD_1002}

[1002](daad-aor)

; ── Interop extension pair (Opus allowed, G.711 still preferred) ───────
; 1003 / 1004 exercise the trailing-Opus interop profile
; ([PCMU, PCMA, Opus], SDES-SRTP still mandatory). Never used for JBM
; closed-profile verification — 1001/1002 stay ulaw+alaw only.

[1003](daad-endpoint-opus)
aors = 1003
auth = 1003

[1003](daad-auth)
username = 1003
password = ${DAAD_TEST_PASSWORD_1003}

[1003](daad-aor)

[1004](daad-endpoint-opus)
aors = 1004
auth = 1004

[1004](daad-auth)
username = 1004
password = ${DAAD_TEST_PASSWORD_1004}

[1004](daad-aor)

; Extension dialing only — no trunk, no outbound, no ARI/admin exposure.
