; Extension dialing only. Numeric destinations 1001/1002.
; No trunks, no outbound PSTN, no premium numbers.

[daad-extensions]
; Inter-extension dial: 1001 <-> 1002 (the 10-min 2-client soak pair)
exten => 1001,1,NoOp(Dialing test extension 1001)
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

exten => 1002,1,NoOp(Dialing test extension 1002)
 same => n,Dial(PJSIP/1002,30)
 same => n,Hangup()

; Echo test for one-client audio loopback verification
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Hangup-cause probe used by CANCEL/BYE race tests
exten => 699,1,NoOp(Hangup probe)
 same => n,Answer()
 same => n,Wait(2)
 same => n,Hangup()

; Anything else: reject (numeric-dial restriction is enforced client-side;
; server-side this catch-all blocks non-test destinations).
exten => _X.,1,NoOp(Rejected dial to ${EXTEN})
 same => n,Hangup(21)
